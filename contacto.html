<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto · Layover</title>
<meta name="description" content="Layover: organiza tu estudio como un viaje. Gana XP, sube de escala y mantén tu racha.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239a6220'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='serif'%3ELy%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Karla:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main>

<div class="wrap" style="max-width:640px;padding-top:34px">
  <div class="sec-head">
    <div class="kicker">Contacto</div>
    <h2>Escríbenos</h2>
    <p>¿Una idea, un error o una duda? Tu mensaje se guarda y lo leemos desde el panel de administración.</p>
  </div>
  <form class="card" id="form-contacto" novalidate>
    <div class="field"><label class="f" for="c-nombre">Nombre</label><input id="c-nombre" type="text" maxlength="80" autocomplete="name" required></div>
    <div class="field"><label class="f" for="c-email">Correo</label><input id="c-email" type="email" maxlength="120" autocomplete="email" required></div>
    <div class="field"><label class="f" for="c-mensaje">Mensaje</label><textarea id="c-mensaje" rows="5" maxlength="1000" required></textarea></div>
    <div id="c-msg" class="msg hidden" role="status"></div>
    <button class="btn" type="submit" id="c-btn">Enviar mensaje</button>
  </form>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script type="module" src="js/pages/contacto.js"></script>
</body>
</html>
